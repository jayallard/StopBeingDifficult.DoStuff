- id: list-dotnet-sdks
  name: List .NET SDKs
  description: Lists the installed .NET SDKs (exit code 0 = at least one found, 1 = none).
  type: powershell
  command: |-
    Import-Module Sbd.Dotnet
    Get-DotnetSdks
- id: install-dotnet-sdk
  name: Install .NET SDK
  description: Installs the given major version of the .NET SDK via winget, if it isn't already installed.
  type: powershell
  parameters:
    - name: Major
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Dotnet
    Install-DotnetSdk -Major $Major
- id: install-dotnet-8
  name: Install .NET 8
  baseTaskId: install-dotnet-sdk
  parameterValues:
    Major: 8
- id: install-dotnet-10
  name: Install .NET 10
  baseTaskId: install-dotnet-sdk
  parameterValues:
    Major: 10
- id: install-dotnet-11
  name: Install .NET 11
  baseTaskId: install-dotnet-sdk
  parameterValues:
    Major: 11
- id: install-dotnet-core-2-2
  name: Install .NET Core 2.2
  description: Installs the .NET Core 2.2 SDK (2.2.207) by downloading Microsoft's installer, since winget has no package for it. Needs an elevated session.
  type: powershell
  command: |-
    Import-Module Sbd.Dotnet
    Install-DotnetLegacySdk -Version 2.2
- id: build-dotnet-solution
  name: Build .NET Solution
  description: Compiles a solution or project with `dotnet build` (or MSBuild/devenv, via the BuildTool parameter) in the chosen configuration (Debug or Release).
  type: powershell
  parameters:
    - name: SolutionPath
      type: filePath
      description: Path to the .sln/.slnx/.csproj file, or a directory containing one
      required: true
      canOverride: true
    - name: Configuration
      description: Build configuration, Debug or Release
      defaultValue: Debug
      canOverride: true
    - name: BuildTool
      description: Build tool. dotnet runs `dotnet build`; msbuild uses Visual Studio's MSBuild (required for .sqlproj projects); devenv uses Visual Studio's devenv.com (the IDE's own build; needed for Website projects, whose bin folder MSBuild doesn't populate) and ignores SuppressWarnings
      type: selectList
      options:
        - dotnet
        - msbuild
        - devenv
      canOverride: true
    - name: SuppressWarnings
      description: Hide compiler warnings from the build output to reduce noise (errors are still shown)
      type: boolean
      defaultValue: 'true'
      canOverride: true
  command: |-
    Import-Module Sbd.Dotnet
    Build-DotnetSolution -SolutionPath $SolutionPath -Configuration $Configuration -BuildTool $BuildTool -SuppressWarnings:($SuppressWarnings -eq 'true')
