- id: get-iis-version
  name: Get IIS Version
  description: Prints the version of IIS, if it's installed
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 10.0
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Iis
    Test-IisVersion -MinVersion $MinVersion
- id: install-iis
  name: Install or Update IIS
  description: Installs IIS, or enables any missing IIS features if it's already installed. Requires running as Administrator. IIS itself is updated through Windows Update.
  type: powershell
  parameters:
    - name: Features
      defaultValue: IIS-WebServerRole,IIS-WebServer,IIS-CommonHttpFeatures,IIS-StaticContent,IIS-DefaultDocument,IIS-HttpErrors,IIS-HealthAndDiagnostics,IIS-HttpLogging,IIS-Security,IIS-RequestFiltering,IIS-Performance,IIS-HttpCompressionStatic,IIS-WebServerManagementTools,IIS-ManagementConsole
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Iis
    Install-Iis -Feature $Features
- id: remove-iis
  name: Remove IIS
  description: Completely uninstalls IIS and every IIS feature (including any added since it was installed) and the Windows Process Activation Service. Site content under inetpub is not deleted. Requires running as Administrator.
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Uninstall-Iis
- id: check-url-rewrite
  name: Check IIS URL Rewrite
  description: Checks whether IIS URL Rewrite is installed (exit code 0 = installed, 2 = not installed).
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Test-IisUrlRewrite
- id: install-url-rewrite
  name: Install IIS URL Rewrite
  description: Installs IIS URL Rewrite, if it isn't already installed. Requires running as Administrator.
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Install-IisUrlRewrite
- id: uninstall-url-rewrite
  name: Uninstall IIS URL Rewrite
  description: Uninstalls IIS URL Rewrite. Succeeds if it isn't installed. Requires running as Administrator.
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Uninstall-IisUrlRewrite
- id: check-request-routing
  name: Check IIS Request Routing (ARR)
  description: Checks whether IIS Request Routing (ARR) is installed (exit code 0 = installed, 2 = not installed).
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Test-IisRequestRouting
- id: install-request-routing
  name: Install IIS Request Routing (ARR)
  description: Installs IIS Request Routing (ARR), if it isn't already installed. Requires running as Administrator.
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Install-IisRequestRouting
- id: uninstall-request-routing
  name: Uninstall IIS Request Routing (ARR)
  description: Uninstalls IIS Request Routing (ARR). Succeeds if it isn't installed. Requires running as Administrator.
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Uninstall-IisRequestRouting
- id: check-dotnet-6-hosting-bundle
  name: Check .NET 6 Hosting Bundle
  description: Checks whether .NET 6 Hosting Bundle is installed (exit code 0 = installed, 2 = not installed).
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Test-AspNetCoreHostingBundle -Version '6.0'
- id: install-dotnet-6-hosting-bundle
  name: Install .NET 6 Hosting Bundle
  description: Installs .NET 6 Hosting Bundle, if it isn't already installed. Requires running as Administrator.
  type: powershell
  command: |-
