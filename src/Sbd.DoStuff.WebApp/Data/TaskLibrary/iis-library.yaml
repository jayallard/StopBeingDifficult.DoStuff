- id: uninstall-dotnet-6-hosting-bundle
  name: Uninstall .NET 6 Hosting Bundle
  description: Uninstalls .NET 6 Hosting Bundle. Succeeds if it isn't installed. Requires running as Administrator.
  type: powershell
  command: |-
    Import-Module Sbd.Iis
    Uninstall-AspNetCoreHostingBundle -Version '6.0'
