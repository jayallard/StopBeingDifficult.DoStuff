- id: slow-dir
  name: Slow Dir
  description: Show the contents of a directory unnecessarily slowly
  type: powershell
  command: |-
    Get-ChildItem -r | ForEach-Object {
      Write-Output "File!!!"
      Write-Error "Error!!!"
      Start-Sleep -Milliseconds 250
    }
  parameters: []
- id: delete-folder
  name: Delete Folder
  description: Recursively deletes a folder
  type: powershell
  command: 'Remove-Item -Recurse -Force "{FolderName}"'
  parameters:
    - name: FolderName
      description: Absolute path to delete
      required: true
      defaultValue: null
- id: delete-temp-folder
  name: Delete Temp Folder
  description: 'Deletes C:\temp'
  baseTaskId: delete-folder
  parameterValues:
    FolderName: 'C:\temp'
