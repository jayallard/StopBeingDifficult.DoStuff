- id: get-winget-version
  icon: winget
  name: Get Winget Version
  description: Prints the version of winget
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 1.29
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.WinGet
    Test-WinGetVersion -MinVersion $MinVersion
- id: install-winget
  icon: winget
  name: Install WinGet
  description: Install WinGet, if it isn't already installed.
  type: powershell
  command: |-
    Import-Module Sbd.WinGet
    Install-WinGet
