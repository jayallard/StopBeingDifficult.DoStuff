- id: execute-sql-script
  icon: sql
  name: Execute SQL Script
  description: Runs a SQL Server script as a single transaction. The script is split into batches on GO lines; each batch is echoed followed by its result grid(s), rows affected and server messages. If any batch fails everything is rolled back, otherwise it is committed.
  type: powershell
  parameters:
    - name: ConnectionStringSetting
      description: Name of the configuration setting holding the connection string, e.g. ConnectionStrings:Main. Set it in appsettings.json, user secrets or an environment variable (ConnectionStrings__Main).
      required: true
      canOverride: true
      configurationSetting: true
    - name: Script
      type: multilineText
      required: true
      canOverride: true
    - name: InitialCatalog
      description: Optional database name (Initial Catalog); overrides the one in the connection string.
      canOverride: true
    - name: CommandTimeout
      description: Seconds each batch may run before it is cancelled; 0 means no limit (use it for long restores).
      defaultValue: '300'
      canOverride: true
    - name: UseTransaction
      description: 'true (default) runs the whole script in one transaction and rolls it all back on any failure. Set to false for scripts with statements that cannot run in a transaction (ALTER DATABASE, RESTORE DATABASE, CREATE DATABASE, ...): each batch then commits as it runs and the first failure stops the script without undoing earlier batches.'
      defaultValue: 'true'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Invoke-SqlScript -ConnectionStringSetting $ConnectionStringSetting -Script $Script -InitialCatalog $InitialCatalog -CommandTimeout ([int]$CommandTimeout) -UseTransaction ($UseTransaction -ne 'false')
- id: execute-sql-file
  icon: sql
  name: Execute SQL File
  description: Runs a SQL Server script file exactly like Execute SQL Script (batches split on GO, one transaction, rolled back on any failure). Fails if the file doesn't exist.
  type: powershell
  parameters:
    - name: ConnectionStringSetting
      description: Name of the configuration setting holding the connection string, e.g. ConnectionStrings:Main. Set it in appsettings.json, user secrets or an environment variable (ConnectionStrings__Main).
      required: true
      canOverride: true
      configurationSetting: true
    - name: ScriptPath
      type: filePath
      description: Path to the .sql file to run.
      required: true
      canOverride: true
    - name: InitialCatalog
      description: Optional database name (Initial Catalog); overrides the one in the connection string.
      canOverride: true
    - name: CommandTimeout
      description: Seconds each batch may run before it is cancelled; 0 means no limit (use it for long restores).
      defaultValue: '300'
      canOverride: true
    - name: UseTransaction
      description: 'true (default) runs the whole script in one transaction and rolls it all back on any failure. Set to false for scripts with statements that cannot run in a transaction (ALTER DATABASE, RESTORE DATABASE, CREATE DATABASE, ...): each batch then commits as it runs and the first failure stops the script without undoing earlier batches.'
      defaultValue: 'true'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Invoke-SqlFile -ConnectionStringSetting $ConnectionStringSetting -ScriptPath $ScriptPath -InitialCatalog $InitialCatalog -CommandTimeout ([int]$CommandTimeout) -UseTransaction ($UseTransaction -ne 'false')
- id: install-ssms
  icon: visualstudio
  name: Install SSMS
  description: Installs SQL Server Management Studio via winget, if it isn't already installed. The installer may ask for administrator approval.
  type: powershell
  parameters:
    - name: PackageId
      description: The winget package id. Each major SSMS version has its own, e.g. Microsoft.SQLServerManagementStudio.21.
      defaultValue: Microsoft.SQLServerManagementStudio.22
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Install-Ssms -PackageId $PackageId
- id: install-sql-server-developer
  icon: sql
  name: Install SQL Server Developer
  description: Installs SQL Server 2025 Developer Edition via winget, if the default instance isn't already installed. (The SQL Server 2022 installer is outdated and Microsoft's setup now refuses to run it.) The installer may ask for administrator approval and can take several minutes. After installing, waits for the SQL Server service to be running.
  type: powershell
  parameters:
    - name: PackageId
      description: The winget package id, e.g. Microsoft.SQLServer.2025.Developer.
      defaultValue: Microsoft.SQLServer.2025.Developer
      required: true
      canOverride: true
    - name: StartTimeoutSeconds
      description: How long to wait for the SQL Server service to be running after the install before failing.
      defaultValue: '600'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Install-SqlServerDeveloper -PackageId $PackageId -StartTimeoutSeconds ([int]$StartTimeoutSeconds)
- id: enable-sql-server-mixed-mode
  icon: sql
  name: Enable SQL Server Mixed Mode
  description: Allows both Windows and SQL Server logins on the local default SQL Server instance, enables the sa login and gives it a new random password, which is shown in the output of this run (and kept in the run history). Does nothing, and reports success, if mixed mode and the sa login are already enabled. Otherwise restarts the SQL Server service, so any open connections are dropped, and generates a new sa password. Connects with the connection string named by ConnectionStringSetting, whose login must be a sysadmin on the instance (the account that installed SQL Server is); the restart may ask for administrator approval.
  type: powershell
  parameters:
    - name: ConnectionStringSetting
      description: Name of the configuration setting holding the connection string, e.g. ConnectionStrings:LocalSqlServer. Its login must be a sysadmin on the local default instance (Windows authentication as the installing account works). Set it in appsettings.json, user secrets or an environment variable (ConnectionStrings__LocalSqlServer).
      required: true
      canOverride: true
      configurationSetting: true
    - name: StartTimeoutSeconds
      description: How long to wait for SQL Server to accept connections after the restart before failing.
      defaultValue: '300'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Enable-SqlServerMixedMode -ConnectionStringSetting $ConnectionStringSetting -StartTimeoutSeconds ([int]$StartTimeoutSeconds)
- id: list-sql-databases
  icon: sql
  name: List SQL Databases
  description: Lists every database on the instance with the disk space its data and log files take (allocated file size in MB, largest first), plus the total.
  type: powershell
  parameters:
    - name: ConnectionStringSetting
      description: Name of the configuration setting holding the connection string, e.g. ConnectionStrings:Main. Set it in appsettings.json, user secrets or an environment variable (ConnectionStrings__Main).
      required: true
      canOverride: true
      configurationSetting: true
    - name: CommandTimeout
      defaultValue: '300'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Get-SqlDatabaseSize -ConnectionStringSetting $ConnectionStringSetting -CommandTimeout ([int]$CommandTimeout)
- id: drop-sql-users
  icon: sql
  name: Drop SQL Users and Logins
  description: Drops database users, and the server logins of the same names, from a SQL Server instance. For each name, drops the matching user from every listed database (handing any schema it owns to dbo first), then kills the login's open sessions and drops the login if there is one. Never drops sa or the login this task connects with. Reports the outcome for every user in every database and for every login, saying whether it was dropped, not done and why (no such user, database not found, built-in principal), or failed with the server error. Runs as a dry run that only lists the statements unless DryRun is set to false. Users in unlisted databases are left as orphans; a login that owns a database or SQL Agent jobs can't be dropped until those are reassigned.
  type: powershell
  parameters:
    - name: ConnectionStringSetting
      description: Name of the configuration setting holding the connection string, e.g. ConnectionStrings:Main. Its login needs permission to drop users and logins (ALTER ANY LOGIN and ALTER ANY USER, or sysadmin). Set it in appsettings.json, user secrets or an environment variable (ConnectionStrings__Main).
      required: true
      canOverride: true
      configurationSetting: true
    - name: UserNames
      description: The user and login names to drop, separated by commas or new lines.
      required: true
      canOverride: true
    - name: DatabaseNames
      description: The databases to drop the users from, separated by commas or new lines.
      required: true
      canOverride: true
    - name: DryRun
      description: When true (the default), only lists what would be dropped. Set to false to drop them.
      defaultValue: 'true'
      canOverride: true
    - name: CommandTimeout
      defaultValue: '300'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Remove-SqlUser -ConnectionStringSetting $ConnectionStringSetting -UserNames $UserNames -DatabaseNames $DatabaseNames -DryRun ($DryRun -ne 'false') -CommandTimeout ([int]$CommandTimeout)

- id: publish-dacpac
  icon: sql
  name: Publish DacPac
  description: Publishes a .dacpac to a SQL Server database with SqlPackage, taking the deployment options (drop objects not in source, block on data loss, SQLCMD variables, ...) from a publish profile (.publish.xml). The server and login come from the configured connection string (the profile's own connection string is ignored) and the database from the profile, unless TargetDatabaseName overrides it; if no connection string setting is given, the profile's own target is used. Set ScriptOnly to true to print the deployment script without changing anything. Requires SqlPackage (dotnet tool install -g microsoft.sqlpackage).
  type: powershell
  parameters:
    - name: ConnectionStringSetting
      description: Name of the configuration setting holding the target connection string, e.g. ConnectionStrings:Main. Its login needs permission to create/alter objects in the target database. Set it in appsettings.json, user secrets or an environment variable (ConnectionStrings__Main). Optional - leave blank to deploy to the target named in the publish profile, which then needs a working TargetConnectionString.
      canOverride: true
      configurationSetting: true
    - name: DacPacPath
      type: filePath
      description: Path to the .dacpac file to publish (the build output of the SQL project).
      required: true
      canOverride: true
    - name: PublishProfilePath
      type: filePath
      description: Path to the publish profile (.publish.xml) holding the deployment options.
      required: true
      canOverride: true
    - name: TargetDatabaseName
      description: Optional database name; overrides the one in the publish profile (and in the connection string). Leave blank to use the profile's.
      canOverride: true
    - name: SqlCmdVariables
      type: multilineText
      description: Optional SQLCMD variable values as NAME=VALUE entries, separated by commas or new lines; they override the values in the profile.
      canOverride: true
    - name: CommandTimeout
      description: Seconds a deployment statement may run before it is cancelled; 0 means no limit.
      defaultValue: '300'
      canOverride: true
    - name: ScriptOnly
      type: boolean
      description: 'When true, generates and prints the deployment script instead of running it (a safe preview: nothing is changed). Default false.'
      defaultValue: 'false'
      canOverride: true
  command: |-
    Import-Module Sbd.Sql
    Publish-DacPac -ConnectionStringSetting $ConnectionStringSetting -DacPacPath $DacPacPath -PublishProfilePath $PublishProfilePath -TargetDatabaseName $TargetDatabaseName -SqlCmdVariables $SqlCmdVariables -CommandTimeout ([int]$CommandTimeout) -ScriptOnly ($ScriptOnly -eq 'true')
