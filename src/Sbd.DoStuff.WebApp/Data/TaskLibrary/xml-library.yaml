- id: set-xml-value
  icon: xml
  name: Set XML Value
  description: Sets the value of every node in an XML file matching an XPath expression (element text or attribute value). Fails if the file is missing or nothing matches. For files with a default namespace use local-name() in the XPath.
  type: powershell
  parameters:
    - name: FileName
      required: true
      type: filePath
      canOverride: true
    - name: XPath
      required: true
      canOverride: true
    - name: Value
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Xml
    Set-XmlValue -FileName $FileName -XPath $XPath -Value $Value

- id: set-web-config-app-settings
  icon: xml
  name: Set web.config App Settings
  description: Adds, updates or deletes entries in the appSettings section of a web.config (or of an extension file whose root is that section). Fails if the file contains no appSettings element or more than one. Settings are commands, one per line - "set key value" or "delete key" - and the output reports each one as created, updated, not updated (value unchanged), deleted or not deleted (key doesn't exist). Fails if the file doesn't exist.
  type: powershell
  parameters:
    - name: FileName
      description: Path to the web.config file.
      required: true
      type: filePath
      canOverride: true
    - name: Settings
      description: "Multiline commands, one per line: 'set key value' (adds or updates; the value is the rest of the line) or 'delete key'."
      required: true
      type: multilineText
      canOverride: true
  command: |-
    Import-Module Sbd.Xml
    Set-WebConfigAppSettings -FileName $FileName -Settings $Settings

- id: set-web-config-connection-strings
  icon: xml
  name: Set web.config Connection Strings
  description: Adds, updates or deletes entries in the single connectionStrings section of a web.config (or of an extension file whose root is that section). Fails if the file contains no connectionStrings element or more than one. ConnectionStrings are commands, one per line - "set name connection string" or "delete name". Set adds a missing name with the given ProviderName, or updates an existing entry's connection string and provider. The output reports each one as created, updated, not updated (unchanged), deleted or not deleted (name doesn't exist). Fails if the file doesn't exist.
  type: powershell
  parameters:
    - name: FileName
      description: Path to the web.config file.
      required: true
      type: filePath
      canOverride: true
    - name: ProviderName
      description: Value of the providerName attribute on each connection string.
      required: false
      defaultValue: Microsoft.Data.SqlClient
      canOverride: true
    - name: ConnectionStrings
      description: "Multiline commands, one per line: 'set name connection string' (adds or updates; the connection string is the rest of the line) or 'delete name'."
      required: true
      type: multilineText
      canOverride: true
  command: |-
    Import-Module Sbd.Xml
    Set-WebConfigConnectionStrings -FileName $FileName -ProviderName $ProviderName -ConnectionStrings $ConnectionStrings
