- id: check-wsl-version
  name: Check WSL Version
  description: Checks that the Windows Subsystem for Linux is installed and at least MinVersion (exit code 0 = passed, 1 = too old, 2 = not installed).
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 2.0.0
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Wsl
    Test-WslVersion -MinVersion $MinVersion
- id: install-wsl
  name: Install WSL
  description: Installs the Windows Subsystem for Linux (no distribution) or updates it if already installed. Requires an elevated session; a restart may be needed.
  type: powershell
  command: |-
    Import-Module Sbd.Wsl
    Install-Wsl
- id: enable-virtual-machine-platform
  name: Enable Virtual Machine Platform
  description: Enables the Windows Virtual Machine Platform optional feature, which WSL 2 requires. Requires an elevated session; a restart may be needed.
  type: powershell
  command: |-
    Import-Module Sbd.Wsl
    Enable-VirtualMachinePlatform
