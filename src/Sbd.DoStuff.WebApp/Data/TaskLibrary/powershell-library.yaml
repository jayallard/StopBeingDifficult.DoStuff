- id: install-powershell
  icon: powershell
  name: Install or Update PowerShell
  description: Installs PowerShell 7+, or updates it if it's already installed. Runs under Windows PowerShell 5.1 so it works before PowerShell 7 exists.
  type: windows-powershell
  command: |-
    Import-Module Sbd.PowerShell
    Install-PowerShell
- id: get-powershell-version
  icon: powershell
  name: Get PowerShell Version
  description: Prints the version of PowerShell 7+ (pwsh)
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 7.5.0
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.PowerShell
    Test-PowerShellVersion -MinVersion $MinVersion
- id: run-powershell-script
  icon: powershell
  name: Run PowerShell Script
  description: Runs a PowerShell script file, under PowerShell 7+ or Windows PowerShell 5.1 as selected. The working directory is the script's folder, and its exit code becomes the task's result.
  type: '{Shell}'
  parameters:
    - name: Shell
      type: selectList
      description: Which PowerShell runs the script. Fails if the selected one isn't installed.
      options:
        - PowerShell
        - Windows PowerShell
      defaultValue: PowerShell
      canOverride: true
    - name: ScriptPath
      type: filePath
      description: Full path to the .ps1 file to run.
      required: true
      canOverride: true
    - name: Arguments
      type: multilineText
      description: Optional arguments passed to the script, one per line. Blank lines are ignored.
      defaultValue: ''
      canOverride: true
  command: |-
    if (-not (Test-Path -LiteralPath $ScriptPath -PathType Leaf)) {
        Write-Error "Script not found: $ScriptPath"
        exit 2
    }
    Set-Location -LiteralPath (Split-Path -Parent (Resolve-Path -LiteralPath $ScriptPath).ProviderPath)
    $scriptArguments = @($Arguments -split '\r?\n' | Where-Object { $_.Trim() })
    & $ScriptPath @scriptArguments
- id: get-windows-powershell-version
  icon: powershell
  name: Get Windows PowerShell Version
  description: Prints the version of Windows PowerShell 5.1 (powershell.exe)
  type: windows-powershell
  command: |-
    Write-Output ":Windows PowerShell Version: $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
- id: run-batch-file
  icon: batch
  name: Run Batch File
  description: Runs a .bat or .cmd file via cmd.exe. The working directory is the file's folder, and its exit code becomes the task's result.
  type: powershell
  parameters:
    - name: BatchPath
      type: filePath
      description: Full path to the .bat or .cmd file to run.
      required: true
      canOverride: true
    - name: Arguments
      type: multilineText
      description: Optional arguments passed to the batch file, one per line. Blank lines are ignored.
      defaultValue: ''
      canOverride: true
  command: |-
    if (-not (Test-Path -LiteralPath $BatchPath -PathType Leaf)) {
        Write-Error "Batch file not found: $BatchPath"
        exit 2
    }
    Set-Location -LiteralPath (Split-Path -Parent (Resolve-Path -LiteralPath $BatchPath).ProviderPath)
    $batchArguments = @($Arguments -split '\r?\n' | Where-Object { $_.Trim() })
    & cmd.exe /c $BatchPath @batchArguments
