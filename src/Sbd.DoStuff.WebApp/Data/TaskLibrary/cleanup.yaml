- id: slow-dir
  name: Slow Dir
  description: Show the contents of a directory unnecessarily slowly
  type: shell
  command: |-
    powershell -Command "Get-ChildItem -r | ForEach-Object { $_; Start-Sleep -Milliseconds 250 }"
  parameters: []
- id: delete-folder
  name: Delete Folder
  description: Recursively deletes a folder
  type: shell
  command: 'rmdir /s /q "{FolderName}"'
  parameters:
    - name: FolderName
      description: Absolute path to delete
      required: true
      defaultValue: null
- id: delete-temp-folder
  name: Delete Temp Folder
  description: 'Deletes C:\temp'
  baseTaskId: delete-folder
  parameterValues:
    FolderName: 'C:\temp'
