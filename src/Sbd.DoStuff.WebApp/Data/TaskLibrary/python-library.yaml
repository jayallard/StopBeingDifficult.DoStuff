- id: install-python
  name: Install Python
  description: Installs Python via winget, if it isn't already installed. Version is the major.minor series to install.
  type: powershell
  parameters:
    - name: Version
      description: The Python major.minor series to install, e.g. 3.13
      defaultValue: '3.13'
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Python
    Install-Python -Version $Version
- id: check-python-version
  name: Check Python Version
  description: Checks that Python is installed and at least MinVersion (exit code 0 = passed, 1 = too old, 2 = not installed).
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: '3.10'
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Python
    Test-PythonVersion -MinVersion $MinVersion
