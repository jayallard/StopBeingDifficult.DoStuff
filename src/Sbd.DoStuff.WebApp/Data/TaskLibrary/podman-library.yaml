- id: install-podman
  name: Install Podman
  description: Installs Podman via winget, if it isn't already installed, and creates and starts the default Podman machine.
  type: powershell
  parameters:
    - name: Version
      defaultValue: 6.1.4
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Podman
    Install-Podman -Version $Version
- id: install-podman-compose
  name: Install Podman Compose
  description: Adds the compose component to Podman by installing Docker Compose (the provider used by `podman compose`) via winget. Requires Podman.
  type: powershell
  command: |-
    Import-Module Sbd.Podman
    Install-PodmanCompose
- id: uninstall-podman
  name: Uninstall Podman
  description: Deletes every Podman machine (including all containers and images in them) and uninstalls Podman via winget. Succeeds if it isn't installed.
  type: powershell
  command: |-
    Import-Module Sbd.Podman
    Uninstall-Podman
- id: check-podman-version
  name: Check Podman Version
  description: Checks that Podman is installed and at least MinVersion (exit code 0 = passed, 1 = too old, 2 = not installed).
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 6.1.4
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Podman
    Test-PodmanVersion -MinVersion $MinVersion
- id: podman-compose-up
  name: Podman Compose Up
  description: Starts the services in a compose file in the background (`podman compose up -d`). Requires Podman and Podman Compose.
  type: powershell
  parameters:
    - name: ComposeFile
      type: filePath
      description: Full path to the compose file.
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Podman
    Start-PodmanCompose -ComposeFile $ComposeFile

- id: allow-podman-insecure-registry
  name: Allow Insecure Podman Registry
  description: Allows plain-HTTP access to a container registry from Podman (it is prohibited by default). Does nothing if the registry is already allowed. Requires a running Podman machine.
  type: powershell
  parameters:
    - name: DockerRegistryUrl
      description: The registry to allow, e.g. nexus.example.org:18000 (a leading http:// is ignored).
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Podman
    Add-PodmanInsecureRegistry -RegistryUrl $DockerRegistryUrl
