- id: is-vscode-installed
  name: Is VsCode Installed?
  description: fails if VsCode is not installed.
  type: powershell
  command: |-
    if (Get-Command code -ErrorAction SilentlyContinue) {
      Write-Output "!Dummy!!!"
      Write-Output ":VS Code is installed."
      exit 0
    }
    
    Write-Output "!VS Code is NOT installed."
    exit 1
