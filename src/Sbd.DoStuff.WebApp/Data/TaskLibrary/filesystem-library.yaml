- id: create-symbolic-link
  icon: filesystem
  name: Create Symbolic Link
  description: Creates a symbolic link (or junction) at LinkPath that maps to the existing folder TargetPath, so anything that reads LinkPath sees the contents of TargetPath. Missing parent folders of LinkPath are created. Re-running is safe; a link that already points at TargetPath is left alone. An existing link to a different folder is replaced only when Force is true, and a real file or folder at LinkPath is never removed. SymbolicLink requires an elevated session or Windows Developer Mode; Junction does not.
  type: powershell
  parameters:
    - name: LinkPath
      description: The path where the link is created, e.g. the old location that other tooling still points at.
      required: true
      canOverride: true
    - name: TargetPath
      description: The existing folder the link maps to. It must already exist.
      required: true
      canOverride: true
    - name: LinkType
      description: 'SymbolicLink (default) or Junction. A Junction needs no elevation or Developer Mode but only works for folders on local volumes.'
      defaultValue: SymbolicLink
      canOverride: true
    - name: Force
      description: 'When true, replaces an existing link at LinkPath that points somewhere else. Never replaces a real file or folder. Default false.'
      defaultValue: 'false'
      canOverride: true
  command: |-
    Import-Module Sbd.FileSystem
    New-FolderLink -LinkPath $LinkPath -TargetPath $TargetPath -LinkType $LinkType -Force ($Force -eq 'true')

- id: copy-file
  icon: filesystem
  name: Copy File
  description: Copies SourceFile to TargetFile. If TargetFile already exists it is overwritten. Missing parent folders of TargetFile are created. TargetFile must be a file path, not an existing folder.
  type: powershell
  parameters:
    - name: SourceFile
      type: filePath
      description: The existing file to copy.
      required: true
      canOverride: true
    - name: TargetFile
      type: filePath
      description: The full path of the copy. An existing file at this path is overwritten.
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.FileSystem
    Copy-FileOverwrite -SourceFile $SourceFile -TargetFile $TargetFile

- id: text-replace
  icon: filesystem
  name: Text Replace
  description: Replaces every occurrence of FindText with ReplaceText in a file. FindText is matched literally, not as a regular expression. The file's encoding is preserved, and the file is left untouched when FindText isn't found.
  type: powershell
  parameters:
    - name: FilePath
      description: The existing text file to modify.
      required: true
      canOverride: true
    - name: FindText
      description: The literal text to search for. Must not be empty.
      required: true
      canOverride: true
    - name: ReplaceText
      description: The text to put in place of each match. Leave empty to delete the matched text.
      defaultValue: ''
      canOverride: true
    - name: CaseSensitive
      description: 'When true, only exact-case matches are replaced. Default false.'
      defaultValue: 'false'
      canOverride: true
  command: |-
    Import-Module Sbd.FileSystem
    Update-FileText -FilePath $FilePath -FindText $FindText -ReplaceText $ReplaceText -CaseSensitive ($CaseSensitive -eq 'true')

- id: create-folder
  icon: filesystem
  name: Create Folder
  description: Makes sure the folder at FolderPath exists, creating any missing parts of the path. The output shows which leading part of the path already existed and which parts were created. A folder that already exists is success; the task fails only if the path can't be created (e.g. a part of it is a file, or access is denied).
  type: powershell
  parameters:
    - name: FolderPath
      description: The full path of the folder to create.
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.FileSystem
    New-Folder -Path $FolderPath
