- id: install-git
  name: Install Git
  description: Install git, if it isn't already installed.
  type: powershell
  command: |-
    Import-Module Sbd.Git
    Install-Git
- id: get-git-version
  name: Get Git CLI Version
  description: Prints the version of git
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 2.53.0
      required: true
      canOverride: true
  command: |-
    Import-Module Sbd.Git
    Test-GitVersion -MinVersion $MinVersion
