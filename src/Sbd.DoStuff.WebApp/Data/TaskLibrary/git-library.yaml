- id: get-git-version
  name: Get Git CLI Version
  description: Prints the version of git
  type: powershell
  parameters:
    - name: MinVersion
      defaultValue: 2.53.0
      required: true
      canOverride: true
  command: |-
    $gitVersion = git --version
    $min = [version]$MinVersion

    if ($LASTEXITCODE -ne 0) {
      Write-Output "Git failed with exit code $LASTEXITCODE. Is git not installed?"
      exit -1
    }
  
  
    if ($gitVersion -match '\b(\d+\.\d+\.\d+)\b') {
      $v = [version]$Matches[1];
      Write-Output ":Git Version: $v"
      if ($v -lt $min) {
        Write-Error "Git Version validation failed. $v is less than $min"
        exit 1
      }
    }
    
    Write-Output ":Passed: $v >= 2.53.0"
    exit 0  
